# Configuración DataSource (MariaDB)
spring.datasource.url=jdbc:mariadb://localhost:3306/sistema_visto_bueno?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=12345678
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Hibernate ddl-auto: las tablas ya existen en MariaDB
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=true

# Codificación UTF-8 estricta para acentos y caracteres en español
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.servlet.encoding.force-response=true
spring.thymeleaf.encoding=UTF-8
spring.messages.encoding=UTF-8

