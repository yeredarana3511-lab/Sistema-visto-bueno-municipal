# Configuración DataSource (MariaDB / MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/sistema_visto_bueno?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate ddl-auto update crea o actualiza las tablas sin borrar datos
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Forzar el dialecto de base de datos
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

