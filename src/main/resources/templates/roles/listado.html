<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Roles</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom">
        <div class="d-flex align-items-center">
            <a th:href="@{/inicio}" class="btn btn-outline-secondary btn-sm me-3">
                <i class="bi bi-arrow-left me-1"></i> Volver al Inicio
            </a>
            <h2 class="mb-0 fs-3">Listado de Roles</h2>
        </div>
        <a th:href="@{/roles/nuevo}" class="btn btn-success">+ Nuevo Rol</a>
    </div>

    <table class="table table-striped table-bordered bg-white shadow-sm">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Clave</th>
            <th>Nombre</th>
            <th>Permisos</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="r : ${roles}">
            <td th:text="${r.id}">1</td>
            <td th:text="${r.clave}">SUPER_ADMIN</td>
            <td th:text="${r.nombre}">Super Administrador</td>
            <td>
                <span th:each="p : ${r.permisos}" class="badge bg-info text-dark me-1" th:text="${p}"></span>
            </td>
            <td>
                <a th:href="@{/roles/editar/{id}(id=${r.id})}" class="btn btn-sm btn-warning">Editar</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
