<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Gestión de Rol</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">
<div class="container mt-4">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
            <h4 class="mb-0" th:text="${rol.id == null ? 'Crear Rol' : 'Editar Rol'}">Rol</h4>
            <a th:href="@{/roles}" class="btn btn-outline-light btn-sm">
                <i class="bi bi-arrow-left me-1"></i> Volver a Roles
            </a>
        </div>
        <div class="card-body">
            <form th:action="@{/roles/guardar}" th:object="${rol}" method="post">
                <input type="hidden" th:field="*{id}"/>
                <div class="mb-3">
                    <label class="form-label">Clave (ej: SECRETARIA o SUPERVISOR):</label>
                    <input type="text" class="form-control" th:field="*{clave}" required />
                </div>
                <div class="mb-3">
                    <label class="form-label">Nombre Visible (ej: Secretari@ o Supervisor):</label>
                    <input type="text" class="form-control" th:field="*{nombre}" required />
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Permisos por Módulo:</label>
                    <div class="row">
                        <div class="col-md-4 mb-2" th:each="permiso : ${permisosDisponibles}">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox"
                                       th:field="*{permisos}"
                                       th:value="${permiso}"
                                       th:id="${permiso}">
                                <label class="form-check-label" th:for="${permiso}" th:text="${permiso}"></label>
                            </div>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn btn-success">Guardar Rol</button>
                <a th:href="@{/roles}" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
