<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Sistema Visto Bueno</title>
    <!-- Bootstrap 5 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card-login {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            background-color: #ffffff;
            overflow: hidden;
            width: 100%;
            max-width: 420px;
        }
        .login-header {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: white;
            padding: 2.5rem 2rem;
            text-align: center;
        }
        .login-header i {
            font-size: 3rem;
            margin-bottom: 0.5rem;
        }
        .login-body {
            padding: 2rem;
        }
        .form-control:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 0.25rem rgba(37, 99, 235, 0.25);
        }
        .btn-primary {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            border: none;
            padding: 0.75rem;
            font-weight: 600;
            border-radius: 0.5rem;
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
        }
    </style>
</head>
<body>

<div class="card-login">
    <!-- Encabezado con ícono -->
    <div class="login-header">
        <i class="bi bi-shield-check"></i>
        <h3 class="fw-bold m-0">Visto Bueno</h3>
        <p class="small text-white-50 m-0 mt-1">Sistema de Gestión de Usuarios</p>
    </div>

    <!-- Cuerpo del formulario -->
    <div class="login-body">
        <!-- Alertas de estado -->
        <div th:if="${param.error}" class="alert alert-danger alert-dismissible fade show text-center py-2 mb-3" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-1"></i> Credenciales incorrectas.
        </div>
        <div th:if="${param.logout}" class="alert alert-info alert-dismissible fade show text-center py-2 mb-3" role="alert">
            <i class="bi bi-info-circle-fill me-1"></i> Sesión cerrada exitosamente.
        </div>

        <form th:action="@{/login}" method="post">
            <!-- Campo Usuario / Número de Empleado -->
            <div class="mb-3">
                <label for="username" class="form-label text-secondary fw-semibold">Número de Empleado</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-secondary"><i class="bi bi-person-fill"></i></span>
                    <input type="text" id="username" name="username" class="form-control" placeholder="Ej. ADMIN01" required autofocus>
                </div>
            </div>

            <!-- Campo Contraseña -->
            <div class="mb-4">
                <label for="password" class="form-label text-secondary fw-semibold">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-secondary"><i class="bi bi-lock-fill"></i></span>
                    <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>
            </div>

            <!-- Botón de Ingreso -->
            <div class="d-grid">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar Sesión
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
