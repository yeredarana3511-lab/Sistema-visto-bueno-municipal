<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Formulario Usuario</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-4">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0" th:text="${usuario.id == null ? 'Nuevo Usuario' : 'Editar Usuario'}">Usuario</h4>
        </div>
        <div class="card-body">
            <form th:action="@{/usuarios/guardar}" th:object="${usuario}" method="post">
                <input type="hidden" th:field="*{id}"/>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">No. Empleado:</label>
                        <input type="text" class="form-control" th:field="*{numeroEmpleado}" required/>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Correo Institucional:</label>
                        <input type="email" class="form-control" th:field="*{correo}" required/>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Nombre:</label>
                        <input type="text" class="form-control" th:field="*{nombre}" required/>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Apellidos:</label>
                        <input type="text" class="form-control" th:field="*{apellidos}"/>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Rol:</label>
                        <select class="form-select" th:field="*{rol.id}" required>
                            <option value="">-- Seleccionar Rol --</option>
                            <option th:each="r : ${roles}" th:value="${r.id}" th:text="${r.nombre}"></option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Contraseña (Dejar en blanco para no cambiar):</label>
                        <input type="password" name="password" class="form-control" th:required="${usuario.id == null}"/>
                    </div>
                </div>

                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" th:field="*{activo}" id="activo">
                    <label class="form-check-label" for="activo">Usuario Activo</label>
                </div>

                <button type="submit" class="btn btn-success">Guardar Usuario</button>
                <a th:href="@{/usuarios}" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
