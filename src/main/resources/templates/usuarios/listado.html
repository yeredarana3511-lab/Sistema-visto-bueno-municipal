<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Usuarios - Sistema Visto Bueno</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">
<div class="container mt-4">
    <!-- Encabezado con botón de volver al inicio y cerrar sesión -->
    <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
        <div class="d-flex align-items-center">
            <a th:href="@{/inicio}" class="btn btn-outline-secondary btn-sm me-3">
                <i class="bi bi-arrow-left me-1"></i> Volver al Inicio
            </a>
            <h2 class="mb-0 fs-3">Módulo de Usuarios</h2>
        </div>
        <form th:action="@{/logout}" method="post" class="d-inline m-0">
            <button type="submit" class="btn btn-outline-danger btn-sm">
                <i class="bi bi-box-arrow-right me-1"></i> Cerrar Sesión
            </button>
        </form>
    </div>

    <!-- Filtros de búsqueda -->
    <form th:action="@{/usuarios}" method="get" class="row g-3 my-3">
        <div class="col-md-4">
            <input type="text" name="filtro" class="form-control" placeholder="Buscar por emp, nombre..." th:value="${filtro}">
        </div>
        <div class="col-md-3">
            <select name="activo" class="form-select">
                <option value="">-- Todos los estados --</option>
                <option value="true" th:selected="${activo == true}">Activos</option>
                <option value="false" th:selected="${activo == false}">Inactivos</option>
            </select>
        </div>
        <div class="col-md-3">
            <button type="submit" class="btn btn-primary">Filtrar</button>
            <a th:href="@{/usuarios}" class="btn btn-outline-secondary">Limpiar</a>
        </div>
        <div class="col-md-2 text-end">
            <a th:href="@{/usuarios/nuevo}" class="btn btn-success">+ Nuevo Usuario</a>
        </div>
    </form>

    <!-- Tabla de resultados -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-striped table-hover mb-0">
                <thead class="table-dark">
                <tr>
                    <th>No. Empleado</th>
                    <th>Nombre Completo</th>
                    <th>Correo</th>
                    <th>Rol</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <!-- Si no hay usuarios -->
                <tr th:if="${#lists.isEmpty(usuarios)}">
                    <td colspan="6" class="text-center py-4 text-muted">
                        No se encontraron usuarios registrados.
                    </td>
                </tr>

                <!-- Iteración de usuarios con manejo seguro de nulos -->
                <tr th:each="u : ${usuarios}">
                    <td th:text="${u.numeroEmpleado}">ADMIN01</td>
                    <td th:text="${u.nombre + (u.apellidos != null ? ' ' + u.apellidos : '')}">Nombre</td>
                    <td th:text="${u.correo}">correo@ejemplo.com</td>
                    <td>
                        <span class="badge bg-info text-dark"
                              th:text="${u.rol != null ? u.rol.nombre : 'Sin Rol'}">
                        </span>
                    </td>
                    <td>
                        <span th:class="${u.activo ? 'badge bg-success' : 'badge bg-danger'}"
                              th:text="${u.activo ? 'Activo' : 'Inactivo'}">
                        </span>
                    </td>
                    <td>
                        <a th:href="@{/usuarios/editar/{id}(id=${u.id})}" class="btn btn-sm btn-warning">Editar</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
